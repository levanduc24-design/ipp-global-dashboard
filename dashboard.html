<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPP GLOBAL — Management Dashboard V4.1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#142033;padding:24px}#status{max-width:700px;margin:80px auto;background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:24px;text-align:center}#status b{font-size:18px}</style></head><body><div id="status"><b>Đang tải IPP GLOBAL Management Dashboard…</b><div style="margin-top:8px;color:#687386">Đang áp dụng bản sửa dữ liệu Bán hàng.</div></div><script>(async()=>{try{const r=await fetch('index.html?patch='+Date.now(),{cache:'no-store'});let h=await r.text();const oldSalesVal="salesVal=m=>{let x=Number(DATA[m]?.sales?.sales_value)||0,r=val(m,'01');return r&&Math.abs(x/r-2)<.001?r:x}";const newSalesVal="salesVal=m=>Number(DATA[m]?.sales?.sales_value)||0";if(!h.includes(oldSalesVal))throw new Error('Không tìm thấy đoạn logic salesVal cần sửa.');h=h.replace(oldSalesVal,newSalesVal);const oldKpi="kpi([['Doanh số bán hàng',s.sales],['Tổng thanh toán',s.pay],['Số lượng bán',s.units],['Giá trị trả lại',s.ret]],'salesKpi')";const newKpi="kpi([['Doanh số bán hàng',s.sales],['Tổng thanh toán',s.pay],['Chênh lệch DS - thanh toán',s.sales-s.pay,(s.sales-s.pay)>0?'warn':'good'],['Số lượng bán',s.units],['Giá trị trả lại',s.ret]],'salesKpi')";if(!h.includes(oldKpi))throw new Error('Không tìm thấy đoạn KPI Bán hàng cần sửa.');h=h.replace(oldKpi,newKpi);h=h.replaceAll('Management Dashboard V4','Management Dashboard V4.1');h=h.replaceAll('IPP GLOBAL • Management Dashboard V4 •','IPP GLOBAL • Management Dashboard V4.1 •');document.open();document.write(h);document.close()}catch(e){document.getElementById('status').innerHTML='<b>Không thể tải dashboard</b><div style="margin-top:8px;color:#c53b3b">'+e.message+'</div><div style="margin-top:14px;color:#687386">Hãy tải lại trang sau vài giây.</div>'}})();</script></body></html>
